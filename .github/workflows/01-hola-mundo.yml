name: Hola Cloud

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorar:
    runs-on: ubuntu-latest

    steps:
      - name: Saludar
        run: echo "Hola desde GitHub Actions"

      - name: Explorar el runner
        run: |
          whoami
          pwd
          uname -a

      - name: Mostrar contexto
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "Repositorio: $REPOSITORY"
          echo "Rama: $BRANCH"
          echo "Usuario: $ACTOR"
